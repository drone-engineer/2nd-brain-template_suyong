<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box { fill:#fff; stroke:#555; stroke-width:1.5; rx:8; }
      .t { font-size:13px; fill:#222; text-anchor:middle; }
      .st { font-size:11px; fill:#555; text-anchor:middle; }
      .ttl { font-size:14px; font-weight:bold; fill:#222; text-anchor:middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="1180" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="34" class="ttl">2nd Brain — UAV Swarm 운영 워크플로우</text>

  <!-- 0. Sources -->
  <rect x="320" y="56" width="260" height="64" class="box" fill="#e1f5ff"/>
  <text x="450" y="82" class="t">수집 소스 (무료 OA)</text>
  <text x="450" y="102" class="st">arXiv · Semantic Scholar · OpenAlex · Zotero/KCI</text>

  <!-- 1. collect -->
  <rect x="300" y="160" width="300" height="80" class="box" fill="#fff3e0"/>
  <text x="450" y="186" class="t">① collect-evidence</text>
  <text x="450" y="206" class="st">auto-collect-papers.py (OA만, 중복제거)</text>
  <text x="450" y="226" class="st">→ raw/articles/*.md (sha256 + provenance)</text>

  <!-- Gate A -->
  <circle cx="450" cy="290" r="34" class="box" fill="#fff"/>
  <text x="450" y="288" class="t">Gate A</text>
  <text x="450" y="304" class="st">원본 무결성</text>

  <!-- 2. compile -->
  <rect x="300" y="354" width="300" height="80" class="box" fill="#e8f5e9"/>
  <text x="450" y="380" class="t">② compile-wiki (Canonical)</text>
  <text x="450" y="400" class="st">llm-wiki 스킬</text>
  <text x="450" y="420" class="st">→ concepts/ comparisons/ queries/</text>

  <!-- Gate B -->
  <circle cx="450" cy="484" r="34" class="box" fill="#fff"/>
  <text x="450" y="482" class="t">Gate B</text>
  <text x="450" y="498" class="st">check-gate-b.py</text>

  <!-- 3. graph -->
  <rect x="300" y="548" width="300" height="80" class="box" fill="#f3e5f5"/>
  <text x="450" y="574" class="t">③ build-knowledge-graph</text>
  <text x="450" y="594" class="st">understand-knowledge</text>
  <text x="450" y="614" class="st">→ .ua/knowledge-graph.json (128 nodes)</text>

  <!-- 4. human gate -->
  <rect x="300" y="662" width="300" height="96" class="box" fill="#ffebee"/>
  <text x="450" y="688" class="t">④ Human Decision Gate</text>
  <text x="450" y="708" class="st">inbox/review-queue.md</text>
  <text x="450" y="728" class="st">Accepted / Rejected / Contested</text>
  <text x="450" y="748" class="st">→ canonical 확정 or 되돌리기</text>

  <!-- 5. notebooklm -->
  <rect x="300" y="790" width="300" height="80" class="box" fill="#e0f7fa"/>
  <text x="450" y="816" class="t">⑤ NotebookLM 질의 증분</text>
  <text x="450" y="836" class="st">노트북 소스 추가 → 재질의</text>
  <text x="450" y="856" class="st">→ queries/ 편입</text>

  <!-- 6. cron -->
  <rect x="300" y="894" width="300" height="80" class="box" fill="#f1f8e9"/>
  <text x="450" y="920" class="t">⑥ 자동화 (Hermes Cron)</text>
  <text x="450" y="940" class="st">second-brain-collect-review</text>
  <text x="450" y="960" class="st">매주 월 09:00 KST → 수집 루프</text>

  <!-- Arrows -->
  <line x1="450" y1="120" x2="450" y2="158" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="240" x2="450" y2="256" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="324" x2="450" y2="352" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="434" x2="450" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="518" x2="450" y2="546" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="628" x2="450" y2="660" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="758" x2="450" y2="788" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="870" x2="450" y2="892" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- cron loop back -->
  <path d="M600,934 C760,934 760,239 600,200" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="775" y="570" class="st" fill="#2e7d32">주기적 실행</text>
</svg>
