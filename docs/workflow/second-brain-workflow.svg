<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="Noto Sans KR, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#42a5f5"/>
    </marker>
    <style>
      .b { fill:#263238; stroke:#607d8b; stroke-width:1.3; rx:8; }
      .tt { font-size:13px; font-weight:bold; fill:#eceff1; text-anchor:middle; }
      .st { font-size:10px; fill:#b0bec5; text-anchor:middle; }
      .lbl { font-size:15px; font-weight:bold; fill:#fff; text-anchor:middle; }
      .cap { font-size:11px; font-weight:bold; fill:#cfd8dc; text-anchor:middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="1180" height="720" fill="#161616"/>
  <text x="590" y="32" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2nd-Brain 운영 워크플로우 : Evidence to Reusable Knowledge</text>
  <text x="590" y="54" font-size="11" fill="#90a4ae" text-anchor="middle">Hermes Gateway Scheduler - project fresh - downstream gate enforcement (UAV Swarm 운용판)</text>

  <!-- Stage 1 Capture -->
  <rect x="30" y="80" width="260" height="260" rx="10" fill="#0d2b36" stroke="#4fc3f7"/>
  <text x="160" y="104" class="lbl" fill="#81d4fa">1. Capture · 캡처</text>
  <rect x="48" y="116" width="224" height="58" class="b" fill="#103a4a" stroke="#4fc3f7"/>
  <text x="160" y="138" class="st" fill="#b3e5fc">Hermes Agent · Zotero API</text>
  <text x="160" y="156" class="st" fill="#b3e5fc">Obsidian Vault · arXiv/S2/OpenAlex</text>
  <rect x="48" y="184" width="224" height="40" class="b" fill="#103a4a"/>
  <text x="160" y="203" class="st" fill="#b3e5fc">source URL · KCI · PDF</text>
  <rect x="48" y="234" width="224" height="36" class="b" fill="#0a1f28"/>
  <text x="160" y="257" class="cap">raw data (URL, PDF, ...)</text>
  <rect x="48" y="282" width="224" height="34" class="b" fill="#0a1f28" stroke="#26c6da"/>
  <text x="160" y="304" class="cap" fill="#80deea">raw/ (sha256 + provenance)</text>

  <!-- Stage 2 Compile -->
  <rect x="320" y="80" width="260" height="260" rx="10" fill="#0d2b1f" stroke="#66bb6a"/>
  <text x="450" y="104" class="lbl" fill="#a5d6a7">2. Compile · 컴파일</text>
  <rect x="338" y="116" width="224" height="58" class="b" fill="#143726" stroke="#66bb6a"/>
  <text x="450" y="138" class="st" fill="#c8e6c9">Hermes Agent</text>
  <text x="450" y="156" class="st" fill="#c8e6c9">llm-wiki · indexer</text>
  <rect x="338" y="184" width="224" height="40" class="b" fill="#143726"/>
  <text x="450" y="203" class="st" fill="#c8e6c9">source → canonical</text>
  <rect x="338" y="234" width="224" height="36" class="b" fill="#0a1f14"/>
  <text x="450" y="257" class="cap">canonical (concepts/queries)</text>
  <rect x="338" y="282" width="224" height="34" class="b" fill="#0a1f14" stroke="#66bb6a"/>
  <text x="450" y="304" class="cap" fill="#a5d6a7">Gate B: check-gate-b.py</text>

  <!-- Stage 3 Discovery -->
  <rect x="610" y="80" width="260" height="260" rx="10" fill="#2a1638" stroke="#ab47bc"/>
  <text x="740" y="104" class="lbl" fill="#ce93d8">3. Discovery · 가설 탐색</text>
  <rect x="628" y="116" width="224" height="58" class="b" fill="#3a1f4d" stroke="#ab47bc"/>
  <text x="740" y="138" class="st" fill="#e1bee7">Hermes Crew</text>
  <text x="740" y="156" class="st" fill="#e1bee7">build-knowledge-graph</text>
  <rect x="628" y="184" width="224" height="40" class="b" fill="#3a1f4d"/>
  <text x="740" y="203" class="st" fill="#e1bee7">Gaps / Hypothesis / Graph</text>
  <rect x="628" y="234" width="224" height="36" class="b" fill="#1f0f2b"/>
  <text x="740" y="257" class="cap">.ua/ graph (128 nodes)</text>
  <rect x="628" y="282" width="224" height="34" class="b" fill="#1f0f2b" stroke="#ab47bc"/>
  <text x="740" y="304" class="cap" fill="#ce93d8">NotebookLM 질의 증분</text>

  <!-- Stage 4 Human Decision -->
  <rect x="900" y="80" width="250" height="260" rx="10" fill="#3a1622" stroke="#f06292"/>
  <text x="1025" y="104" class="lbl" fill="#f8bbd0">4. Human Decision · 검증</text>
  <rect x="918" y="116" width="214" height="58" class="b" fill="#4a1c2c" stroke="#f06292"/>
  <text x="1025" y="138" class="st" fill="#f8bbd0">Human Review Data</text>
  <text x="1025" y="156" class="st" fill="#f8bbd0">Hermes Editor</text>
  <rect x="918" y="184" width="68" height="40" class="b" fill="#1b3a22" stroke="#66bb6a"/>
  <text x="952" y="203" class="st" fill="#a5d6a7">Accepted</text>
  <rect x="992" y="184" width="64" height="40" class="b" fill="#3a1b1b" stroke="#ef5350"/>
  <text x="1024" y="203" class="st" fill="#ef9a9a">Rejected</text>
  <rect x="1062" y="184" width="64" height="40" class="b" fill="#3a301b" stroke="#ffca28"/>
  <text x="1094" y="203" class="st" fill="#ffe082">Pending</text>
  <rect x="918" y="234" width="214" height="36" class="b" fill="#1f0f16"/>
  <text x="1025" y="257" class="cap">inbox/review-queue.md</text>
  <rect x="918" y="282" width="214" height="34" class="b" fill="#1f0f16" stroke="#f06292"/>
  <text x="1025" y="304" class="cap" fill="#f8bbd0">Accepted → canonical 확정</text>

  <!-- arrows between stages -->
  <line x1="290" y1="210" x2="318" y2="210" stroke="#42a5f5" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="580" y1="210" x2="608" y2="210" stroke="#42a5f5" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="870" y1="210" x2="898" y2="210" stroke="#42a5f5" stroke-width="2.5" marker-end="url(#arw)"/>
  <!-- distill far right -->
  <line x1="1150" y1="210" x2="1160" y2="210" stroke="#42a5f5" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="1175" y="200" font-size="9" fill="#90a4ae" text-anchor="middle">distill</text>

  <!-- Feedback Loop -->
  <text x="590" y="400" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Feedback Loop — Accepted revision / canonical 반영 및 UI/UX 개선점</text>
  <rect x="30" y="420" width="210" height="64" rx="8" fill="#e65100" stroke="#ff9800"/>
  <text x="135" y="446" class="st" fill="#fff">Hermes Editor</text>
  <text x="135" y="464" class="st" fill="#fff">Accepted revision / canonical</text>
  <rect x="255" y="420" width="210" height="64" rx="8" fill="#1565c0" stroke="#42a5f5"/>
  <text x="360" y="446" class="st" fill="#fff">Hermes Publisher</text>
  <text x="360" y="464" class="st" fill="#fff">UI/UX 개선 (링크, 레이아웃)</text>
  <rect x="480" y="420" width="210" height="64" rx="8" fill="#ad1457" stroke="#f06292"/>
  <text x="585" y="446" class="st" fill="#fff">Hermes Agent</text>
  <text x="585" y="464" class="st" fill="#fff">graph/context/ref ingest</text>
  <rect x="705" y="420" width="210" height="64" rx="8" fill="#2e7d32" stroke="#66bb6a"/>
  <text x="810" y="446" class="st" fill="#fff">Web Health Check</text>
  <text x="810" y="464" class="st" fill="#fff">LLM ingest audit hash</text>
  <rect x="930" y="420" width="210" height="64" rx="8" fill="#6a1b9a" stroke="#ab47bc"/>
  <text x="1035" y="446" class="st" fill="#fff">Canonical Tracker</text>
  <text x="1035" y="464" class="st" fill="#fff">page + ingest + UI 개선</text>
  <line x1="240" y1="452" x2="253" y2="452" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="465" y1="452" x2="478" y2="452" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="690" y1="452" x2="703" y2="452" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="915" y1="452" x2="928" y2="452" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M1035,484 C590,560 300,560 135,484" fill="none" stroke="#ffca28" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="590" y="552" font-size="10" fill="#ffca28" text-anchor="middle">실행 결과 → 캡처 루프 환류</text>

  <text x="590" y="700" font-size="10" fill="#607d8b" text-anchor="middle">Created with Hermes Agent · Obsidian · Zotero · NotebookLM · Understand Anything — UAV Swarm Research Edition</text>
</svg>
