<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Noto Sans KR, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <style>
      .b { fill:#fff; stroke:#888; stroke-width:1.4; rx:8; }
      .tt { font-size:14px; font-weight:bold; fill:#222; text-anchor:middle; }
      .st { font-size:11px; fill:#555; text-anchor:middle; }
      .lbl { font-size:13px; font-weight:bold; fill:#333; }
    </style>
  </defs>
  <rect x="0" y="0" width="1180" height="760" fill="#1e1e1e"/>

  <!-- Title -->
  <text x="590" y="34" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">2nd-Brain: 증거 기반 개인 지식관리 아키텍처 (UAV Swarm 운용판)</text>

  <!-- ===== Top Automation Control Plane ===== -->
  <rect x="40" y="52" width="1100" height="56" rx="8" fill="#0d3b4f" stroke="#26c6da"/>
  <text x="200" y="76" font-size="13" font-weight="bold" fill="#e0f7fa" text-anchor="middle">Automation Control Plane</text>
  <text x="200" y="96" font-size="10" fill="#b2ebf2" text-anchor="middle">Hermes Agent + Cron</text>
  <text x="450" y="76" font-size="12" fill="#e0f7fa" text-anchor="middle">→ weekly fresh session</text>
  <text x="700" y="76" font-size="12" fill="#e0f7fa" text-anchor="middle">→ collect + compile + graph</text>
  <text x="950" y="76" font-size="12" fill="#e0f7fa" text-anchor="middle">→ deliver/review (Telegram)</text>

  <!-- ===== LAYER 1: Evidence ===== -->
  <rect x="40" y="130" width="270" height="240" rx="10" fill="#3a2a1a" stroke="#ffb74d"/>
  <text x="175" y="152" class="lbl" fill="#ffcc80">1. Evidence (증거/원천)</text>
  <rect x="60" y="165" width="230" height="44" class="b" fill="#4a3520" stroke="#ffb74d"/>
  <text x="175" y="185" class="st" fill="#ffe0b2">arXiv / Semantic Scholar / OpenAlex</text>
  <text x="175" y="201" class="st" fill="#ffcc80">Zotero · KCI URL (무료 OA)</text>
  <rect x="60" y="222" width="230" height="44" class="b" fill="#4a3520" stroke="#ffb74d"/>
  <text x="175" y="242" class="st" fill="#ffe0b2">raw/ (불변)</text>
  <text x="175" y="258" class="st" fill="#ffcc80">sha256 + provenance</text>
  <rect x="60" y="279" width="230" height="40" class="b" fill="#16323d" stroke="#26c6da"/>
  <text x="175" y="298" class="st" fill="#b2ebf2">Hermes Cron: raw-fresh session</text>
  <text x="175" y="313" class="st" fill="#80deea">매주 월 09:00 KST</text>
  <text x="175" y="358" font-size="10" fill="#ffcc80" text-anchor="middle">raw/articles 30+ · raw/papers (Zotero PDF)</text>

  <!-- ===== LAYER 2: Canonical Memory ===== -->
  <rect x="330" y="130" width="270" height="240" rx="10" fill="#1a3320" stroke="#81c784"/>
  <text x="465" y="152" class="lbl" fill="#a5d6a7">2. Canonical Memory (정기적 기억)</text>
  <rect x="350" y="165" width="230" height="44" class="b" fill="#234127" stroke="#26c6da"/>
  <text x="465" y="185" class="st" fill="#c8e6c9">llm-wiki 스킬</text>
  <text x="465" y="201" class="st" fill="#a5d6a7">개인 가치 기반 Gate &amp; Filter</text>
  <rect x="350" y="222" width="230" height="44" class="b" fill="#234127" stroke="#ffb74d"/>
  <text x="465" y="242" class="st" fill="#c8e6c9">Canonical Markdown</text>
  <text x="465" y="258" class="st" fill="#a5d6a7">concepts / comparisons / queries</text>
  <rect x="350" y="279" width="230" height="40" class="b" fill="#234127" stroke="#ffb74d"/>
  <text x="465" y="298" class="st" fill="#c8e6c9">Governance Contract</text>
  <text x="465" y="313" class="st" fill="#a5d6a7">index + confidence + wikilink</text>
  <text x="465" y="358" font-size="10" fill="#a5d6a7" text-anchor="middle">15 canonical pages · Gate B: check-gate-b.py</text>

  <!-- ===== LAYER 3: Discovery ===== -->
  <rect x="620" y="130" width="270" height="240" rx="10" fill="#2e1a3a" stroke="#ba68c8"/>
  <text x="755" y="152" class="lbl" fill="#e1bee7">3. Discovery (분석/가설)</text>
  <rect x="640" y="165" width="230" height="44" class="b" fill="#3a2347" stroke="#26c6da"/>
  <text x="755" y="185" class="st" fill="#e1bee7">NotebookLM</text>
  <text x="755" y="201" class="st" fill="#ce93d8">질의 + Markdown 클러스터링</text>
  <rect x="640" y="222" width="230" height="44" class="b" fill="#3a2347" stroke="#ba68c8"/>
  <text x="755" y="242" class="st" fill="#e1bee7">understand-knowledge</text>
  <text x="755" y="258" class="st" fill="#ce93d8">.ua/ 그래프 (128 nodes)</text>
  <rect x="640" y="279" width="230" height="40" class="b" fill="#3a2347" stroke="#ba68c8"/>
  <text x="755" y="298" class="st" fill="#e1bee7">dash-board - domain</text>
  <text x="755" y="313" class="st" fill="#ce93d8">공유 · 피드백 · 후속</text>
  <text x="755" y="358" font-size="10" fill="#ce93d8" text-anchor="middle">queries/uav-swarm-survey-landscape 증분</text>

  <!-- ===== LAYER 4: Decision ===== -->
  <rect x="910" y="130" width="230" height="240" rx="10" fill="#3a381a" stroke="#fff176"/>
  <text x="1025" y="152" class="lbl" fill="#fff59d">4. Decision (의사결정)</text>
  <polygon points="1025,170 1075,210 1025,250 975,210" fill="#2e7d32" stroke="#a5d6a7"/>
  <text x="1025" y="206" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Human</text>
  <text x="1025" y="222" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Review</text>
  <text x="1025" y="272" font-size="10" fill="#fff9c4" text-anchor="middle">Accepted / Rejected</text>
  <text x="1025" y="288" font-size="10" fill="#fff9c4" text-anchor="middle">/ Contested</text>
  <rect x="935" y="300" width="180" height="40" class="b" fill="#3a381a" stroke="#fff176"/>
  <text x="1025" y="319" class="st" fill="#fff9c4">지식 저장소 (decoupled)</text>
  <text x="1025" y="358" font-size="10" fill="#fff9c4" text-anchor="middle">inbox/review-queue.md</text>

  <!-- ===== Arrows ===== -->
  <!-- top to layers -->
  <line x1="200" y1="108" x2="175" y2="128" stroke="#26c6da" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="700" y1="108" x2="755" y2="128" stroke="#26c6da" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="950" y1="108" x2="1025" y2="128" stroke="#26c6da" stroke-width="2" marker-end="url(#arw)"/>
  <!-- horizontal layer flow -->
  <line x1="310" y1="249" x2="328" y2="249" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="600" y1="249" x2="618" y2="249" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="890" y1="249" x2="908" y2="249" stroke="#aaa" stroke-width="2" marker-end="url(#arw)"/>
  <!-- feedback loop L4 -> L1 -->
  <path d="M910,380 C500,430 300,430 60,380" fill="none" stroke="#81c784" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="475" y="420" font-size="10" fill="#a5d6a7" text-anchor="middle">실행 결과 피드백 루프</text>

  <!-- footer -->
  <text x="40" y="740" font-size="10" fill="#888">Created with Hermes Agent · Obsidian · NotebookLM · Understand Anything — UAV Swarm Research Edition</text>
</svg>
